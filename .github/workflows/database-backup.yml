name: Frugl PostgreSQL Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create SQL snapshot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Configure the SUPABASE_DB_URL repository secret."
            exit 1
          fi

          backup_name="frugl-db-backup-$(date -u +%Y%m%dT%H%M%SZ).sql"
          backup_file="$RUNNER_TEMP/$backup_name"
          pg_dump --dbname="$SUPABASE_DB_URL" --format=plain --no-owner --no-acl --file="$backup_file"
          echo "BACKUP_NAME=$backup_name" >> "$GITHUB_ENV"
          echo "BACKUP_FILE=$backup_file" >> "$GITHUB_ENV"

      - name: Upload SQL snapshot to private Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Configure the NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SECRET_KEY repository secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST "${SUPABASE_URL%/}/storage/v1/object/admin-backups/${BACKUP_NAME}" \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --header "Content-Type: application/sql" \
            --header "x-upsert: false" \
            --data-binary "@${BACKUP_FILE}"
