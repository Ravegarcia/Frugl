name: Frugl CI & Supabase Keep-Alive

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Keep Supabase active and release expired reservations on a short schedule.
    - cron: '0 0 */4 * *'
    - cron: '*/15 * * * *'

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src

      - name: Run Vitest Unit Tests
        run: npx vitest run

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.1-flash-lite'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'

  keep-alive:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 */4 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Supabase Ping Query
        run: |
          curl -f -X GET "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/laptop_models?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"

  release-expired-reservations:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Release expired reservations
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the PRODUCTION_SITE_URL repository variable and CRON_SECRET repository secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "${SITE_URL%/}/api/cron/release-reservations" \
            --header "Authorization: Bearer ${CRON_SECRET}"
